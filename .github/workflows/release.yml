name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8u192
        run: |
          wget -q https://cdn.azul.com/zulu/bin/zulu8.33.0.1-ca-jdk8.0.192-linux_x64.tar.gz -O /tmp/jdk.tar.gz
          mkdir -p $HOME/jdk
          tar -xzf /tmp/jdk.tar.gz -C $HOME/jdk --strip-components=1
          echo "JAVA_HOME=$HOME/jdk" >> $GITHUB_ENV
          echo "$HOME/jdk/bin" >> $GITHUB_PATH

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Get project version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/ysogate-${{ steps.get_version.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}